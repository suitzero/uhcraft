name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install NDK and CMake
      # NOTE: android-actions/setup-android@v3 is broken (runs `sdkmanager tools`,
      # a package removed from the SDK repo long ago) and unmaintained. The
      # ubuntu-latest runner already ships the Android SDK at $ANDROID_SDK_ROOT,
      # so install NDK/CMake with its preinstalled cmdline-tools directly.
      run: |
        SDKMGR=""
        for d in "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$ANDROID_HOME/cmdline-tools/latest"; do
          if [ -x "$d/bin/sdkmanager" ]; then SDKMGR="$d/bin/sdkmanager"; break; fi
        done
        if [ -z "$SDKMGR" ]; then echo "sdkmanager not found"; exit 1; fi
        export PATH="$(dirname "$SDKMGR"):$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "ndk;25.1.8937393" "cmake;3.22.1"

    - name: Build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
